<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#16241C" flood-opacity="0.14"/>
    </filter>
    <filter id="badgeShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1F7A4D" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="760" height="470" fill="#F5F8F5"/>

  <!-- heading: shows WHERE it appears -->
  <text x="32" y="40" fill="#16241C" font-size="20" font-weight="700">Two links Strain Inspector adds above every product's title</text>

  <!-- illustration tag -->
  <rect x="470" y="58" width="258" height="28" rx="14" fill="#EAEFEA"/>
  <text x="599" y="77" fill="#7A8A80" font-size="14" text-anchor="middle">Illustration, not a real screenshot</text>

  <!-- the card -->
  <g filter="url(#cardShadow)">
    <rect x="32" y="70" width="440" height="360" rx="16" fill="#FFFFFF" stroke="#E4E9E4" stroke-width="1"/>
  </g>

  <!-- Button 1: View on MedBud (its own button) -->
  <g filter="url(#badgeShadow)">
    <rect x="56" y="98" width="212" height="44" rx="22" fill="#1F7A4D"/>
  </g>
  <g transform="translate(74,111)">
    <circle cx="9" cy="9" r="8" fill="none" stroke="#FFFFFF" stroke-width="2.6"/>
    <line x1="15" y1="15" x2="21" y2="21" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <text x="106" y="126" fill="#FFFFFF" font-size="18" font-weight="600">View on MedBud</text>

  <!-- Button 2: Leafly (a separate button, flower only) -->
  <g filter="url(#badgeShadow)">
    <rect x="280" y="98" width="104" height="44" rx="22" fill="#FFFFFF" stroke="#5FA544" stroke-width="1.6"/>
  </g>
  <g transform="translate(300,112)">
    <path d="M2 14 C 2 5, 10 1, 17 1 C 17 10, 11 14, 2 14 Z" fill="#5FA544"/>
    <line x1="4" y1="13" x2="13" y2="4" stroke="#FFFFFF" stroke-width="1.4"/>
  </g>
  <text x="326" y="126" fill="#3E7D1E" font-size="18" font-weight="600">Leafly</text>

  <!-- product image placeholder -->
  <rect x="56" y="158" width="392" height="120" rx="10" fill="#EEF2EE"/>
  <g transform="translate(232,196)" opacity="0.5">
    <circle cx="12" cy="8" r="8" fill="none" stroke="#9DB0A4" stroke-width="3"/>
    <path d="M-8 34 L16 6 L40 34 Z" fill="#C4D2C9"/>
    <circle cx="-2" cy="4" r="5" fill="#C4D2C9"/>
  </g>

  <!-- product meta (synthetic) -->
  <text x="56" y="322" fill="#16241C" font-size="22" font-weight="700">Sample Flower T25 · 10g</text>
  <text x="56" y="350" fill="#6A7A70" font-size="16">Illustrative product · THC 25% / CBD &lt;1%</text>
  <text x="56" y="402" fill="#16241C" font-size="21" font-weight="700">£XX.XX</text>
  <rect x="330" y="378" width="118" height="40" rx="9" fill="#EAEFEA"/>
  <text x="389" y="403" fill="#8A998F" font-size="15" text-anchor="middle">Add to cart</text>

  <!-- callout: two separate buttons -->
  <path d="M520 120 C 470 120, 440 120, 392 120" fill="none" stroke="#C77D2E" stroke-width="2.5" stroke-dasharray="2 6" stroke-linecap="round"/>
  <circle cx="392" cy="120" r="4" fill="#C77D2E"/>
  <text x="524" y="112" fill="#C77D2E" font-size="16" font-weight="700">Two separate buttons.</text>
  <text x="524" y="134" fill="#7A6A55" font-size="14">Everything else is the</text>
  <text x="524" y="153" fill="#7A6A55" font-size="14">portal's own card.</text>

  <!-- link legend -->
  <g transform="translate(524,196)">
    <rect x="0" y="0" width="13" height="13" rx="3" fill="#1F7A4D"/>
    <text x="24" y="11" fill="#16241C" font-size="15" font-weight="600">View on MedBud</text>
    <text x="0" y="33" fill="#6A7A70" font-size="14">patient reviews for</text>
    <text x="0" y="52" fill="#6A7A70" font-size="14">that exact product</text>

    <rect x="0" y="82" width="13" height="13" rx="3" fill="#FFFFFF" stroke="#5FA544" stroke-width="1.5"/>
    <text x="24" y="93" fill="#16241C" font-size="15" font-weight="600">Leafly</text>
    <text x="0" y="115" fill="#6A7A70" font-size="14">terpene &amp; effect profile</text>
    <text x="0" y="134" fill="#6A7A70" font-size="14">(flower cards only)</text>
  </g>
</svg>
